name: Documentation Quality Check

# SECTION: Workflow triggers
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# SECTION: Permissions
permissions:
  contents: read

# SECTION: Quality verification
jobs:
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      # STEP: Prepare verification environment
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Check tool versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        id: prepare
        run: npm ci

      # STEP: Markdownlint
      - name: Check Markdown formatting
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npx --yes markdownlint-cli2 "**/*.md" "#**/node_modules/**"

      # STEP: Prettier
      - name: Check Markdown formatting with Prettier
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: npx --no-install prettier --check "**/*.md"

      # STEP: Link Check
      - name: Check local Markdown links
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --exclude-path node_modules "**/*.md"
          fail: true
