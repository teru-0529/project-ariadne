name: Backend Quality Check

# SECTION: Workflow triggers
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# SECTION: Permissions
permissions:
  contents: read

# SECTION: Quality verification
jobs:
  backend-check:
    name: Backend Check
    if: ${{ github.event_name == 'push' || endsWith(github.head_ref, '-implementation') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      # STEP: Prepare verification environment
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: app/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Check tool versions
        run: |
          go version
          node --version
          npm --version
      - name: Download dependencies
        run: go mod download

      # NOTE: go vet and go test require frontend build output
      # because main.go embeds frontend/dist using go:embed.
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Build frontend
        id: prepare
        working-directory: app/frontend
        run: npm run build

      # STEP: gofmt
      - name: Check Go formatting
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: |
          $files = gofmt -l .
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if ($files) {
            $files
            exit 1
          }

      # STEP: go vet
      - name: Check Go code
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go vet ./...

  backend-test:
    name: Backend Test
    if: ${{ github.event_name == 'push' || endsWith(github.head_ref, '-implementation') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      # STEP: Prepare verification environment
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: app/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Check tool versions
        run: |
          go version
          node --version
          npm --version
      - name: Download dependencies
        run: go mod download

      # NOTE: go vet and go test require frontend build output
      # because main.go embeds frontend/dist using go:embed.
      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci
      - name: Build frontend
        id: prepare
        working-directory: app/frontend
        run: npm run build

      # STEP: go test
      - name: Run Go tests
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: go test -json ./...
