name: Markdown Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Check tool versions
        run: |
          node --version
          npm --version
      - name: Check Markdown formatting
        run: npx --yes markdownlint-cli2 "**/*.md"

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check local Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline "**/*.md"
          fail: true

  prettier-check:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Check Markdown formatting with Prettier
        run: npx --no-install prettier --check "**/*.md"

  format-preview:
    name: Temporary Prettier format preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Set up npm
        run: npm install --global npm@11.17.0
      - name: Install dependencies
        run: npm ci
      - name: Generate formatted Markdown for review
        run: |
          npx --no-install prettier --write "docs/architecture/*.md"
          for file in docs/architecture/*.md; do
            echo "FMT_BEGIN:${file}"
            base64 -w 0 "${file}"
            echo
            echo "FMT_END:${file}"
          done
